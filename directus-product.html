<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Товар METON</title>
  <meta name="description" content="Обладнання для сонячних електростанцій METON.">
  <meta name="robots" content="index,follow">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
  <a class="brand" href="index.html"><span class="mark">M</span><span>METON</span></a>
  <nav class="nav">
    <a href="stations-grid.html">Станції</a><a href="panels-one-sided.html">Панелі</a>
    <a href="inverters-hybrid.html">Інвертори</a><a href="batteries-lifepo4.html">Акумулятори</a>
    <a href="contacts.html">Контакти</a>
  </nav>
</header>
<main>
  <section class="section">
    <article class="detail" id="directusProduct">
      <div class="detail-img"><img src="assets/station.png" alt=""></div>
      <div>
        <span class="badge" data-category>Обладнання</span>
        <h1>Завантаження товару…</h1>
        <p data-description></p>
        <strong class="detail-price">Ціну уточнюйте</strong>
        <ul class="spec-list" data-specs></ul>
        <div class="actions">
          <a class="btn primary" data-cart href="cart.html">В кошик</a>
          <a class="btn ghost" data-sheet hidden target="_blank" rel="noopener">Datasheet виробника</a>
        </div>
      </div>
    </article>
  </section>
</main>
<footer class="footer"><div><strong>METON</strong><p>Сонячна енергетика для дому й бізнесу.</p></div><div class="footer-links"><a href="contacts.html">Контакти</a><a href="tel:+380932852557">+380 93 285 25 57</a></div></footer>
<script>
(function () {
  var CMS = 'https://cms.metongroup.com';
  var id = new URLSearchParams(location.search).get('id');
  if (!id) return;
  fetch(CMS + '/items/products/' + encodeURIComponent(id) + '?fields=*&_=' + Date.now(), { cache: 'no-store' })
    .then(function (response) { if (!response.ok) throw new Error(); return response.json(); })
    .then(function (payload) {
      var p = payload.data;
      var name = p.name || [p.brand, p.model].filter(Boolean).join(' ');
      var price = Number(p.price);
      var suffix = p.currency === 'USD' ? ' $' : p.currency === 'EUR' ? ' €' : ' грн';
      var imageFile = p.image_file && (p.image_file.id || p.image_file);
      var image = imageFile ? CMS + '/assets/' + encodeURIComponent(imageFile) : p.image_url;
      var sheetFile = p.datasheet_file && (p.datasheet_file.id || p.datasheet_file);
      var sheet = sheetFile ? CMS + '/assets/' + encodeURIComponent(sheetFile) : p.datasheet_url;
      document.title = (p.seo_title || name) + (p.seo_title ? '' : ' | METON');
      document.querySelector('h1').textContent = name;
      document.querySelector('[data-description]').textContent = p.description || p.short_description || '';
      document.querySelector('[data-category]').textContent = p.category || p.product_type || 'Обладнання';
      document.querySelector('.detail-price').textContent = price ? price.toLocaleString('uk-UA') + suffix : (p.price_note || 'Ціну уточнюйте');
      if (image) { document.querySelector('.detail-img img').src = image; document.querySelector('.detail-img img').alt = name; }
      var cartId = p.slug || p.id;
      document.querySelector('[data-cart]').href = 'cart.html?add=' + encodeURIComponent(cartId);
      if (sheet) { var link = document.querySelector('[data-sheet]'); link.href = sheet; link.hidden = false; }
      var specs = p.specifications && (p.specifications.items || p.specifications.raw || p.specifications);
      if (Array.isArray(specs)) {
        document.querySelector('[data-specs]').innerHTML = specs.map(function (item) {
          return '<li><strong>' + (item.label || '') + ':</strong> ' + (item.value || '') + '</li>';
        }).join('');
      } else if (specs) {
        document.querySelector('[data-specs]').innerHTML = String(specs).split('|').map(function (item) { return '<li>' + item.trim() + '</li>'; }).join('');
      }
    })
    .catch(function () { document.querySelector('h1').textContent = 'Товар тимчасово недоступний'; });
})();
</script>
</body>
</html>
